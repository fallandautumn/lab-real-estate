version: '3.8'

services:
  lab-db:
    image: postgres:15
    container_name: lab-db-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - lab_db_data:/var/lib/postgresql/data

volumes:
  lab_db_data:
